<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>놀이 발자국 · 글꼴 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 글꼴 (눈누 웹폰트) */
  @font-face{font-family:'KerisKedyuche';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_R.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'KerisKedyuche';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_B.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'SchoolSafetyRoundedSmile';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-R.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'SchoolSafetyRoundedSmile';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'GeekbleMalrangiche';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/GeekbleMalang2WOFF2.woff2') format('woff2');font-weight:400;font-display:swap}

  :root{--ink:#3A2A33;--muted:#8B7781;--accent:#FF9A3C;--ink2:#DB6E0F;--soft:#FFEEDC;--accent2:#8CCB3F;--soft2:#F0F8E0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#FFF7FA;color:var(--ink);line-height:1.6;word-break:keep-all}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 48px}
  header h1{font-size:20px;font-weight:800}
  header p{font-size:13px;color:var(--muted);margin-top:4px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px;position:sticky;top:0;background:#FFF7FA;padding:8px 0;z-index:5}
  .tabs a{font-size:13px;font-weight:700;color:var(--ink2);background:#fff;border:2px solid var(--soft);padding:6px 12px;border-radius:999px;text-decoration:none}

  .opt{margin-top:28px;scroll-margin-top:70px}
  .label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .label b{font-size:16px}
  .label small{font-size:12px;color:var(--muted)}

  .hero{border-radius:28px;padding:20px 18px 22px;text-align:center;position:relative;overflow:hidden;
        background:linear-gradient(160deg,var(--soft) 0%,var(--soft) 45%,var(--soft2) 100%);box-shadow:0 8px 30px rgba(58,42,51,.10)}
  .blob{position:absolute;border-radius:50%;filter:blur(18px);opacity:.5}
  .hero > *:not(.blob){position:relative}
  .eyebrow{font-size:14px;color:var(--muted)}
  .hero img{width:56%;max-width:200px;display:block;margin:4px auto;mix-blend-mode:multiply}
  .name{font-size:32px;color:var(--ink2);line-height:1.25}
  .combo{display:inline-block;margin-top:10px;font-size:16px;color:#fff;padding:8px 18px;border-radius:999px;
         background:linear-gradient(90deg,var(--accent),var(--accent2));text-shadow:0 1px 2px rgba(0,0,0,.18)}
  .slogan{font-size:16px;margin-top:12px}
  .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .tags span{font-size:12px;color:var(--ink2);background:#ffffffcc;padding:4px 10px;border-radius:999px;font-weight:700}
  .card{background:#fff;border-radius:22px;padding:18px;margin-top:12px;box-shadow:0 4px 18px rgba(58,42,51,.06)}
  .card h2{font-size:18px}
  .dom{background:var(--soft);border-radius:16px;padding:14px;margin-top:10px}
  .dom h3{font-size:17px;color:var(--ink2)}
  .dom p{font-size:14.5px;margin-top:4px}

  /* 글꼴 적용: 제목류만 바꾸고 본문은 그대로 */
  .f-kedu   .t{font-family:'KerisKedyuche',Pretendard,sans-serif;font-weight:700}
  .f-smile  .t{font-family:'SchoolSafetyRoundedSmile',Pretendard,sans-serif;font-weight:700}
  .f-malang .t{font-family:'GeekbleMalrangiche',Pretendard,sans-serif;font-weight:400}
  .f-mix    .t{font-family:'SchoolSafetyRoundedSmile',Pretendard,sans-serif;font-weight:700}
  .f-mix    .name{font-family:'KerisKedyuche',Pretendard,sans-serif;font-weight:700}
  .f-base   .t{font-weight:800}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>🦖 놀이 발자국 · 글꼴 비교</h1>
    <p>제목(유형 이름, 배지, 소개 문구, 카드 제목)에만 글꼴을 바꿨어요. 본문은 모두 같아요.</p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
</main>
<script>
{
  const OPTS = [
    ["f-kedu",   "A. 케리스 케듀체",           "굵고 단단한 둥근 글씨 · KERIS"],
    ["f-smile",  "B. 학교안심 둥근미소",        "또박또박 정돈된 귀여움 · KERIS"],
    ["f-malang", "C. 긱블 말랑이체",            "말랑말랑 부드러운 모서리 · 긱블"],
    ["f-mix",    "D. 케듀체 + 둥근미소 조합",   "유형 이름만 케듀체, 나머지 제목은 둥근미소"],
    ["f-base",   "지금 (프리텐다드)",           "비교용 현재 글꼴"],
  ];
  const card = ([cls, title, sub], i) => `
  <section class="opt ${cls}" id="o${i}">
    <div class="label"><b>${title}</b><small>${sub}</small></div>
    <div class="hero">
      <span class="blob" style="left:-8%;top:4%;width:46%;aspect-ratio:1;background:#FF9A3C"></span>
      <span class="blob" style="left:70%;top:18%;width:40%;aspect-ratio:1;background:#8CCB3F"></span>
      <div class="eyebrow t">오늘 우리 아이는</div>
      <img src="images/energy.webp" alt="뿜뿜 발전가 공룡">
      <div class="name t">뿜뿜 발전가</div>
      <div class="combo t">움직이며 궁리하는 발명가</div>
      <div class="slogan t">"일단 해 보고, 더 잘 되는 방법을 찾아요!"</div>
      <div class="tags"><span>#몸으로실험</span><span>#한번더</span><span>#왜그럴까</span></div>
    </div>
    <div class="card">
      <h2 class="t">🔎 왜 이렇게 나왔을까?</h2>
      <div class="dom">
        <h3 class="t">몸으로 움직이기 · 1위 32%</h3>
        <p>뛰고, 밀고, 돌리면서 온몸으로 세상을 알아가는 놀이예요. 오늘은 주로 2F 뿜뿜! 펀 에너지에서 쌓였어요.</p>
      </div>
    </div>
  </section>`;
  document.getElementById("list").innerHTML = OPTS.map(card).join("");
  document.getElementById("tabs").innerHTML = OPTS.map((o, i) => `<a href="#o${i}">${o[1].split(" ")[0]} ${o[1].split(" ").slice(1, 3).join(" ")}</a>`).join("");
}
</script>
</body>
</html>
