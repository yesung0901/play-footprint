<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 놀이 발자국 · 서울상상나라</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  @font-face{font-family:'KerisKedyuche';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_B.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'SchoolSafetyRoundedSmile';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-R.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'SchoolSafetyRoundedSmile';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
  .hero h1{font-family:'KerisKedyuche',Pretendard,sans-serif!important;font-weight:700!important}
  .hero .eyebrow,.combo,.slogan,.pureTag,.cheer,.card h2,h3,.dom .dname,.next .name,.route .where b{font-family:'SchoolSafetyRoundedSmile',Pretendard,sans-serif;font-weight:700}
  :root{
    --pink:#F2679A; --pink-soft:#FFE3EE; --ink:#3A2A33; --muted:#8B7781; --bg:#FFF7FA; --card:#FFFFFF;
    --accent:var(--pink); --accent-ink:var(--pink); --accent-soft:var(--pink-soft); --accent2:var(--pink); --accent2-soft:var(--pink-soft);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px}
  .top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
  .top b{color:var(--pink)}

  /* 발자국 스탬프 */
  .steps{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
  .step{width:62px;text-align:center;font-size:12px;font-weight:700;color:#C9B8C0}
  .step .dot{width:44px;height:44px;margin:0 auto 4px;border-radius:50%;background:#F1E6EB;color:#B9A9B1;
             display:grid;place-items:center;filter:grayscale(1);opacity:.6}
  .step .dot svg{width:22px;height:22px}
  .step .dot img{width:40px;height:40px;object-fit:contain}
  .step.on .dot{color:var(--sc)}
  .step.on{color:var(--sc)}
  .step.on .dot{background:var(--ss);filter:none;opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--sc)}
  .cheer{text-align:center;font-weight:800;font-size:15px;color:var(--pink);margin-bottom:8px}

  /* 메인 — 1등 색 → 2등 색 그라데이션 */
  .hero{border-radius:28px;padding:22px 20px 24px;text-align:center;position:relative;overflow:hidden;
        background:linear-gradient(160deg,var(--accent-soft) 0%,var(--accent-soft) 45%,var(--accent2-soft) 100%);
        box-shadow:0 8px 30px rgba(58,42,51,.10)}
  .hero > *{position:relative;z-index:1}
  .blob{position:absolute!important;z-index:0!important;border-radius:50%;filter:blur(18px);opacity:.55;pointer-events:none}
  .spark{position:absolute!important;z-index:0!important;pointer-events:none;opacity:.9}
  .spark svg{display:block;width:100%;height:100%}
  .hero .eyebrow{font-size:14px;font-weight:700;color:var(--muted)}
  .hero img{width:66%;max-width:240px;display:block;margin:4px auto 6px;mix-blend-mode:multiply}
  .hero h1{font-size:30px;font-weight:900;letter-spacing:-.5px;color:var(--accent-ink);line-height:1.3}
  .hicon{display:inline-block;width:.9em;height:.9em;vertical-align:-.08em;margin-right:6px}
  .hicon svg{width:100%;height:100%}
  .combo{display:inline-block;margin-top:10px;font-size:16px;font-weight:800;color:#fff;padding:8px 18px;border-radius:999px;
         text-shadow:0 1px 2px rgba(0,0,0,.18);background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 4px 12px rgba(0,0,0,.10)}
  .pureTag{display:inline-block;font-size:12px;font-weight:800;color:var(--accent-ink);margin-top:10px;
           background:#fff;border:2px solid var(--accent);padding:3px 12px;border-radius:999px}
  /* 집중형: 희귀 카드 느낌 */
  .hero.pure{background:radial-gradient(circle at 50% 36%,#fff 0%,var(--accent-soft) 42%,color-mix(in srgb,var(--accent) 30%,var(--accent-soft)) 100%);
             box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent),0 12px 34px color-mix(in srgb,var(--accent) 35%,transparent)}
  .hero.pure::before{content:"";position:absolute;inset:-40%;z-index:0;opacity:.22;
             background:repeating-conic-gradient(from 0deg at 50% 50%,#fff 0deg 8deg,transparent 8deg 24deg);
             animation:spin 40s linear infinite}
  .hero.pure .combo{background:linear-gradient(110deg,var(--accent) 0%,var(--accent) 38%,#fff8 50%,var(--accent) 62%,var(--accent) 100%);
             background-size:250% 100%;animation:shine 3.2s ease-in-out infinite}
  .spark{animation:twinkle 2.6s ease-in-out infinite}
  .spark:nth-of-type(2n){animation-delay:1.3s}
  .hero.pure .spark{animation-duration:1.8s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shine{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
  @keyframes twinkle{0%,100%{opacity:.35;scale:.8}50%{opacity:1;scale:1.1}}
  .slogan{font-size:16px;font-weight:700;margin-top:12px;color:var(--muted)}
  .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .tags span{font-size:12px;font-weight:700;color:var(--accent-ink);background:#ffffffcc;padding:4px 10px;border-radius:999px}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

  /* 카드 */
  .card{background:var(--card);border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 4px 18px rgba(58,42,51,.06)}
  .card h2{font-size:17px;font-weight:800;margin-bottom:4px}
  .card .lead{font-size:13px;color:var(--muted);margin-bottom:12px}
  .card p{font-size:15px}
  .muted{color:var(--muted);font-size:14px}
  h3{font-size:15px;font-weight:800;margin:16px 0 6px}

  /* 막대 */
  .bar{margin:12px 0}
  .bar .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:5px}
  .bar .lbl small{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
  .bar .pct{font-weight:800}
  .track{height:12px;background:#F5EDF1;border-radius:999px;overflow:hidden}
  .fill{height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

  /* 영역 설명 */
  .dom{border-radius:18px;padding:16px;margin-top:12px}
  .dom .rank{font-size:12px;font-weight:800}
  .dom .dname{font-size:17px;font-weight:900;margin:2px 0 6px}
  .dom p{font-size:14.5px;margin-top:6px}
  .dom .where{font-weight:700}
  .rest{font-size:14px;color:var(--muted);margin-top:12px;padding-left:2px}
  .rest b{color:var(--ink)}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chips span{font-size:12.5px;font-weight:800;background:#fff;border:1.5px solid;padding:3px 10px;border-radius:999px}
  .dom h4{font-size:13.5px;font-weight:800;margin-top:12px}
  .praise{margin-top:10px;border-left:4px solid var(--accent);padding:6px 0 6px 12px;font-size:15px;font-weight:700}
  .praise small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  /* 놀이 경로 */
  .route{list-style:none;margin-top:8px;position:relative}
  .route::before{content:"";position:absolute;left:58px;top:14px;bottom:14px;width:2px;background:#EEDFE6}
  .route li{display:grid;grid-template-columns:46px 26px 1fr;align-items:center;gap:6px;padding:7px 0}
  .route time{font-size:13px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .route .pin{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;color:#fff}
  .route .pin svg{width:13px;height:13px}
  .route .where{font-size:14.5px}
  .route .where small{color:var(--muted);font-size:12.5px;margin-left:4px}
  /* 더 보기 */
  .clamp{max-height:150px;overflow:hidden;position:relative;transition:max-height .4s ease}
  .clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,var(--fade,#fff))}
  .clamp.open{max-height:2000px}
  .clamp.open::after{display:none}
  .moreBtn{display:block;width:100%;margin-top:8px;padding:8px;border:0;background:none;color:var(--accent-ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer}

  /* 유형 상세 */
  ul.scenes{list-style:none;margin-top:4px}
  ul.scenes li{font-size:15px;padding:8px 0 8px 26px;position:relative;border-bottom:1px dashed #F0E4E9}
  ul.scenes li:last-child{border:0}
  ul.scenes li::before{content:"👀";position:absolute;left:0;top:8px;font-size:14px}
  .tip{margin-top:10px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
  .tip b{color:var(--accent-ink)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .pair div{border-radius:14px;padding:12px;background:#FAF5F7;font-size:13px}
  .pair b{display:block;font-size:14.5px;margin-top:2px}

  /* 사진 */
  .photos{display:flex;gap:8px;overflow-x:auto;margin:12px -4px 0;padding:0 4px 4px;scroll-snap-type:x mandatory}
  .photos img{height:120px;border-radius:14px;flex-shrink:0;scroll-snap-align:start;object-fit:cover}

  /* 접기 */
  details{margin-top:12px;border-top:1px dashed #EADDE3;padding-top:10px}
  summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent-ink);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:" ▾"}
  details[open] summary::after{content:" ▴"}
  details p{font-size:14px;margin-top:8px}

  /* 질문 */
  .q{background:var(--accent-soft);border-radius:16px;padding:12px 16px;margin-top:10px;font-size:15px;font-weight:600}
  .q small{display:block;font-size:11px;font-weight:800;color:var(--accent-ink);margin-bottom:2px}

  /* 다음 방문 */
  .next{display:flex;gap:14px;align-items:center}
  .next img{width:92px;border-radius:16px;flex-shrink:0;mix-blend-mode:multiply;background:var(--accent-soft)}
  .next .floor{font-size:12px;font-weight:800;color:var(--pink)}
  .next .name{font-size:17px;font-weight:800}
  .next p{font-size:14px;color:var(--muted);margin-top:2px}

  .btn{display:block;text-align:center;margin-top:14px;padding:14px;border-radius:16px;
       background:var(--accent-ink);color:#fff;font-weight:800;text-decoration:none;font-size:15px}
  .btn.ghost{background:transparent;color:var(--accent-ink);border:2px solid var(--accent-ink)}

  footer{margin-top:26px;text-align:center;font-size:12px;color:var(--muted)}
  footer .logo{font-weight:800;color:var(--pink);font-size:14px;margin-bottom:4px}
  .empty{text-align:center;padding:60px 10px}
  .empty img{width:60%;max-width:220px;mix-blend-mode:multiply}
  .empty h1{font-size:22px;margin-top:10px}
  .empty p{color:var(--muted);margin-top:6px}
  @media (prefers-reduced-motion:reduce){.fill,.clamp{transition:none}.hero.pure::before,.hero.pure .combo,.spark{animation:none}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
(() => {
/* ═════════════ 설정 (전시나 문구가 바뀌면 여기만 고치면 돼요) ═════════════ */
const SITE = "https://www.seoulchildrensmuseum.org";
const RESERVE_URL = SITE + "/reservation/individualregistration.do";
const PHOTOS_PER_FLOOR = 3;   // images/exhibits/2F-1.jpg … 없으면 자동으로 숨김

const FLOORS = {
  B1:  { name:"그림책 작업실", icon:"🖍️", type:"story", url: SITE + "/display/displayExhibition28.do",
         intro:"그리고 쓰면서 나만의 이야기를 만드는 곳",
         principle:"그림책은 '시작 → 사건 → 끝'의 구조로 이루어져 있어요. 아이는 그림과 글로 자기 경험을 이야기로 엮으면서 생각을 순서대로 정리하는 연습을 했어요." },
  "1F":{ name:"통-하다", icon:"💬", type:"heart", url: SITE + "/display/displayExhibition26.do",
         intro:"표정·몸짓·말로 마음을 주고받는 곳",
         principle:"마음은 말뿐 아니라 표정·눈빛·몸짓으로도 전해져요(비언어적 소통). 다른 사람의 신호를 읽고 내 마음을 전해 보는 경험이 공감하는 힘의 바탕이 돼요." },
  "2F":{ name:"뿜뿜! 펀 에너지", icon:"⚡", type:"energy", url: SITE + "/display/displayExhibition05.do",
         intro:"온몸으로 움직여 에너지를 만드는 곳",
         principle:"페달을 밟거나 뛰는 몸의 움직임(운동 에너지)이 발전기를 돌리면 전기 에너지로 바뀌어요. 이렇게 에너지가 다른 형태로 바뀌는 것을 '에너지 전환'이라고 해요." },
  "3F":{ name:"우리, 캠핑 가요!", icon:"🧭", type:"solver", url: SITE + "/display/displayExhibition08.do",
         intro:"캠핑을 계획하고 문제를 해결하는 곳",
         principle:"캠핑을 준비하려면 필요한 것을 고르고, 순서를 정하고, 예상 못 한 문제에 대처해야 해요. 이렇게 계획하고 조절하는 힘을 '실행 기능'이라고 불러요." },
};
const FLOOR_ORDER = ["B1","1F","2F","3F"];
const svgWrap = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  B1:  svgWrap('<path d="M4 20l1.2-4.2L15.6 5.4a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8.2 18.8z"/><path d="M13.8 7.2l3 3"/>'),
  "1F":svgWrap('<path d="M5 5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/>'),
  "2F":svgWrap('<path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/>'),
  "3F":svgWrap('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'),
  X:   svgWrap('<path d="M5 21V4h11l-2 4 2 4H5"/>'),
};
const stampIcon = f => `<img src="images/icons/${f}.png" alt="" onerror="this.insertAdjacentHTML('afterend', ICONS_SRC['${f}']);this.remove()">`;
window.ICONS_SRC = ICONS;

/* 4가지 놀이 영역 (MBTI의 '축' 설명 역할) */
const TYPES = {
  energy:{ name:"뿜뿜 발전가", emoji:"🏃", deco:"⚡", floor:"2F", color:"#FF9A3C", ink:"#DB6E0F", soft:"#FFEEDC",
           bar:"몸으로 움직이기", barHint:"뛰고, 돌리고, 춤추기",
           what:"뛰고, 밀고, 돌리면서 온몸으로 세상을 알아가는 유형이에요.", strengths:["끈기","몸 조절력","도전 정신"], acts:["페달 발전기","휴먼카","댄스마루","자전거"], praise:["몇 번이나 다시 해 봤네! 끝까지 해내는 모습이 멋졌어.","어떻게 하니까 더 빨리 됐어?"],
           look:"이 유형의 아이들은 '한 번 더!'를 외치며 같은 동작을 반복하고, 더 세게·더 빨리 해 보면서 자기 몸을 조절해 봐요. 해냈을 때의 짜릿함이 다음 도전으로 이어지는 게 특징이에요.",
           grow:"대근육을 쓰는 놀이는 몸의 균형과 조절 능력을 키우고, '내가 해냈다'는 경험이 자신감으로 이어져요.",
           q:[["떠올리기","오늘 몸으로 어떤 에너지를 만들었어?"],["한 걸음 더","우리 집에서도 몸으로 불을 켤 수 있을까?"]],
           why:"첫 질문은 오늘 한 일을 말로 떠올리게 해서 기억을 단단하게 만들어요. 두 번째 질문은 '움직임 → 전기'라는 에너지 전환 원리를 집이라는 새로운 상황에 적용해 보게 해요." },
  solver:{ name:"척척 해결사", emoji:"🧭", deco:"🔍", floor:"3F", color:"#8CCB3F", ink:"#5A9414", soft:"#F0F8E0",
           bar:"생각하고 해결하기", barHint:"계획하고, 고르고, 문제 풀기",
           what:"계획하고, 고르고, 문제를 풀면서 머리로 세상을 알아가는 유형이에요.", strengths:["계획력","문제 해결력","호기심"], acts:["텐트 치기","캠핑 가방 꾸리기","장보기","캠핑 계획 세우기"], praise:["그 방법은 어떻게 생각해 냈어?","잘 안 될 때 다른 방법을 찾아낸 게 정말 멋졌어."],
           look:"이 유형의 아이들은 '이건 왜 그래?', '이렇게 하면 어때?' 하고 묻고, 순서를 정하거나 방법을 바꿔 보며 놀아요. 답을 알려 주기보다 스스로 찾을 시간을 줄 때 가장 즐거워해요.",
           grow:"필요한 것을 고르고 계획대로 해 보는 경험은 생각을 정리하고 스스로 조절하는 힘(실행 기능)을 키워요.",
           q:[["떠올리기","캠핑 갈 때 딱 3개만 챙긴다면 뭘 가져갈래?"],["한 걸음 더","하나를 깜빡하면 어떻게 할까?"]],
           why:"'딱 3개'처럼 조건이 있으면 무엇이 더 중요한지 비교하고 고르게 돼요(우선순위). '깜빡하면?'은 계획이 틀어졌을 때 다른 방법을 찾는 문제 해결 연습이에요." },
  story: { name:"이야기꾼", emoji:"🖍️", deco:"📖", floor:"B1", color:"#BC73E0", ink:"#9145BF", soft:"#F6EBFC",

R.setProperty("--accent2", pure ? T.color : S.color);
R.setProperty("--accent2-soft", pure ? T.soft : S.soft);

const route = (P.get("r") || "").split("_").map(x => x.split(".")).filter(([f, t]) => (FLOOR_ORDER.includes(f) || f === "X") && /^\d{4}$/.test(t || ""));
const routeHtml = route.length ? `
  <section class="card">
    <h2>🗺️ 오늘의 놀이 경로</h2>
    <ul class="route">${route.map(([f, t]) => {
      const time = t.slice(0, 2) + ":" + t.slice(2);
      if (f === "X") return `<li><time>${time}</time><span class="pin" style="background:var(--pink)">${ICONS.X}</span><span class="where"><b>출구</b><small>발자국 ${n}개 완성!</small></span></li>`;
      const ty = TYPES[FLOORS[f].type];
      return `<li><time>${time}</time><span class="pin" style="background:${ty.color}">${ICONS[f]}</span><span class="where"><b>${f} ${FLOORS[f].name}</b><small>${ty.name}</small></span></li>`;
    }).join("")}</ul>
  </section>` : "";
const pct = hasBars ? (() => { const s = bars.reduce((a, b) => a + b, 0); return Object.fromEntries(BAR_ORDER.map((k, i) => [k, Math.round(bars[i] / s * 100)])); })() : null;

/* 꾸밈 아이콘 (1등 아이콘 + 2등 아이콘이 떠 있음) */
const c1 = T.color, c2 = pure ? T.color : S.color;
const blobs = [[-8,4,46,c1],[70,18,40,c2],[-6,56,34,c2],[74,62,44,c1]]
  .map(([x, y, w, c]) => `<span class="blob" style="left:${x}%;top:${y}%;width:${w}%;aspect-ratio:1;background:${c}"></span>`).join("");
const star = c => `<svg viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="${c}"/></svg>`;
const sparkPos = pure
  ? [[10,10,22],[84,8,16],[6,44,14],[88,36,24],[12,66,16],[82,60,14]]
  : [[10,10,18],[84,9,14],[86,40,20],[8,52,14]];
const sparks = sparkPos.map(([x, y, s], i) =>
  `<span class="spark" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px">${star(i % 2 ? "#fff" : (i % 4 ? c2 : c1))}</span>`).join("");
const decos = blobs + sparks;

/* 발자국 */
const steps = FLOOR_ORDER.map(f =>
  `<div class="step ${visited.includes(f) ? "on" : ""}" style="--sc:${TYPES[FLOORS[f].type].ink};--ss:${TYPES[FLOORS[f].type].soft}"><div class="dot">${stampIcon(f)}</div>${f}</div>`).join("");
const cheer = n >= 4 ? "🎉 발자국을 모두 모았어요!" : n > 0 ? `발자국 ${n}개나 모았어요!` : "";
const title = both ? `${T.name}<br><span style="font-size:20px">이면서</span> ${S.name}` : T.name;

/* 영역이 오늘 어디서 쌓였는지 */
const whereLine = k => {
  const f = TYPES[k].floor;
  return visited.includes(f)
    ? `오늘은 <b>${f} ${FLOORS[f].name}</b>에서 이 모습이 가장 많이 보였어요.`
    : `오늘은 여러 전시에서 조금씩 이 모습이 보였어요.`;
};
const domBlock = (k, label, full) => {
  const t = TYPES[k];
  return `
  <div class="dom" style="background:${t.soft}">
    <div class="rank" style="color:${t.ink}">${label}${pct ? ` · ${pct[k]}%` : ""} · ${t.bar}</div>
    <div class="dname" style="color:${t.ink}"><span class="hicon">${ICONS[t.floor]}</span>${t.name}</div>
    <p>${t.what} ${whereLine(k)}</p>
    <div class="chips">${t.strengths.map(x => `<span style="color:${t.ink};border-color:${t.color}">${x}</span>`).join("")}</div>
    <p style="margin-top:10px">${t.look}</p>
    ${full ? `
    <h4 style="color:${t.ink}">이 유형이 좋아하는 전시 활동</h4><p>${t.acts.join(" · ")}</p>
    <h4 style="color:${t.ink}">이 유형으로 자라는 힘</h4><p>${t.grow}</p>` : ""}
  </div>`;
};
const barsHtml = hasBars ? BAR_ORDER.map(k => `
  <div class="bar">
    <div class="lbl"><span>${TYPES[k].name}<small>${TYPES[k].bar}</small></span><span class="pct" style="color:${TYPES[k].ink}">${pct[k]}%</span></div>
    <div class="track"><div class="fill" data-w="${Math.max(4, pct[k] / Math.max(...Object.values(pct)) * 100)}" style="background:${TYPES[k].color}"></div></div>
  </div>`).join("") : "";



const whyHtml = `
  <section class="card">
    <h2>🔎 왜 이렇게 나왔을까?</h2>
    <div class="lead">전시마다 머문 시간을 바탕으로 4가지 유형 점수를 계산했어요. 가장 높은 유형과 두 번째 유형이 만나 오늘의 유형이 돼요.</div>
    ${barsHtml}
    ${domBlock(type, "1위", true)}
    ${pure
      ? `<div class="rest">두 번째로 많이 나온 유형은 <b>${S.name}</b>${pct ? ` ${pct[sub]}%` : ""}예요.</div>`
      : domBlock(sub, "2위", false)}
    ${pure ? `<p class="muted" style="margin-top:12px">✨ 1위가 2위보다 확실히 앞서서 <b>집중형</b>이 나왔어요. 한 가지 놀이에 깊이 빠졌다는 뜻이에요.</p>` : ""}
  </section>`;

const detailHtml = `
  <section class="card">
    <h2>🦖 ${C.title}</h2>
    <div class="lead">${pure ? `${T.name} 성향이 확실하게 나온 집중형이에요` : `${T.name} + ${S.name}가 만난 유형이에요`}</div>
    <div>
      <h3 style="margin-top:4px">오늘 이런 모습이었을 거예요</h3>
      <ul class="scenes">${C.scenes.map(s => `<li>${s}</li>`).join("")}</ul>
      <h3>이 조합으로 자라는 힘</h3>
      <p>${C.grow}</p>
      <div class="tip"><b>🏠 집에서 이어 가기</b><br>${C.tip}</div>
      <h3>💬 오늘은 이렇게 칭찬해 주세요</h3>
      <div class="praise">"${T.praise[0]}"<small>결과보다 과정을 칭찬하면 다음 도전으로 이어져요</small></div>
      <div class="praise" style="border-color:${(pure ? T : S).color}">"${(pure ? T : S).praise[pure ? 1 : 0]}"</div>
    </div>
    <div class="pair">
      <div>🤝 찰떡 놀이 짝꿍<b>${COMBOS[buddyKey].title}</b></div>
      ${nextF ? `<div>🚀 다음 도전<b>${TYPES[FLOORS[nextF].type].name}</b>${nextF} ${FLOORS[nextF].name}에서</div>` : ""}
    </div>
  </section>`;

const photoHtml = f => Array.from({ length: PHOTOS_PER_FLOOR }, (_, i) =>
  `<img src="images/exhibits/${f}-${i + 1}.jpg" alt="${FLOORS[f].name} 사진 ${i + 1}" onerror="this.remove()">`).join("");
const topHtml = topF ? `
  <section class="card">
    <h2>⭐ 가장 푹 빠져 있던 곳</h2>
    <p style="margin-top:8px"><b>${topF} ${FLOORS[topF].name}</b><br><span class="muted">${FLOORS[topF].intro}</span></p>
    <div class="photos">${photoHtml(topF)}</div>
    <details><summary>💡 이 전시에 숨은 원리</summary><p>${FLOORS[topF].principle}</p></details>
  </section>` : "";

const nextHtml = nextF ? `
  <section class="card">
    <h2>🚀 다음엔 이것도 도전!</h2>
    <div class="next" style="margin-top:10px">
      <img src="${img(FLOORS[nextF].type)}" alt="${FLOORS[nextF].name} 공룡">
      <div>
        <div class="floor">${nextF} · ${visited.includes(nextF) ? "다음엔 더 오래 놀아 보기" : "오늘 못 해 본 놀이"}</div>
        <div class="name">${FLOORS[nextF].name}</div>
        <p>${FLOORS[nextF].intro}</p>
      </div>
    </div>
    <a class="btn ghost" href="${RESERVE_URL}" target="_blank" rel="noopener">다음 방문 예약하기</a>
  </section>` : "";

const sheetFloor = FLOORS[T.floor];

app.innerHTML = `
  <div class="top"><span>서울상상나라</span><b>놀이 발자국</b></div>
  ${visited.length ? `<div class="steps">${steps}</div>` : ""}
  ${cheer ? `<div class="cheer">${cheer}</div>` : ""}

  <section class="hero${pure ? " pure" : ""}">
    ${decos}
    <div class="eyebrow">오늘 우리 아이는</div>
    <img src="images/types/${key}.png" onerror="this.onerror=null;this.src='${img(type)}'" alt="${C.title} 공룡">
    <h1><span class="hicon">${ICONS[T.floor]}</span>${title}</h1>
    <div class="combo">${C.title}</div>
    ${pure ? `<br><span class="pureTag">✨ 집중형 · 한 가지 놀이에 푹 빠졌어요</span>` : ""}
    <div class="slogan">"${C.slogan}"</div>
    <div class="tags">${C.tags.map(t => `<span>#${t}</span>`).join("")}</div>
  </section>
  <p class="note">성격 진단이 아니라 <b>오늘의 놀이 방식</b>이에요.<br>다음엔 다른 유형이 나올 수도 있어요!</p>

  ${routeHtml}
  ${whyHtml}
  ${detailHtml}
  ${topHtml}

  <section class="card">
    <h2>🚗 집 가는 길에 물어봐 주세요</h2>
    ${T.q.map(([tag, text]) => `<div class="q"><small>${tag}</small>${text}</div>`).join("")}
    <details><summary>💡 왜 이 질문일까요?</summary><p>${T.why}</p></details>
  </section>

  <section class="card">
    <h2>🏠 집에서 이어서 놀기</h2>
    <p style="margin-top:8px">${sheetFloor.name} 전시 페이지에서 집에서 해 볼 수 있는 워크시트를 내려받을 수 있어요.</p>
    <a class="btn" href="${sheetFloor.url}" target="_blank" rel="noopener">워크시트 보러 가기</a>
  </section>

  ${nextHtml}

  <footer>
    <div class="logo">🦖 놀이 발자국</div>
    카메라 없이 카드 번호와 시간만 사용했어요.<br>이 결과는 어디에도 저장되지 않아요.
  </footer>`;

/* 더 보기 버튼 */
document.querySelectorAll(".moreBtn").forEach(btn => {
  const box = btn.previousElementSibling;
  if (box.scrollHeight <= box.clientHeight + 4) { box.classList.add("open"); btn.remove(); return; }
  btn.addEventListener("click", () => {
    const open = box.classList.toggle("open");
    btn.textContent = open ? "접기 ▴" : "더 보기 ▾";
  });
});
setTimeout(() => document.querySelectorAll(".photos").forEach(el => { if (!el.querySelector("img")) el.remove(); }), 1500);
requestAnimationFrame(() => setTimeout(() =>
  document.querySelectorAll(".fill").forEach(el => el.style.width = el.dataset.w + "%"), 150));
})();
</script>
</body>
</html>
